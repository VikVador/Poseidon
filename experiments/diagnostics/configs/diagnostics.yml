# ====================================
#           P O S E I D O N
# ====================================
#
# ===== WandB =====
#
wandb:
  "project" : ["Poseidon-Diagnostics"]
  "mode"    : ["online"]

# ===== Sampling =====
#
Noise: 
  "sigma_min"   : [0.00001]
  "sigma_max"   : [1000]

Prior: 
  "steps"   : [128]
  "members" : [64]

Posterior: 
  "steps"             : [128]
  "members"           : [64]
  "trajectory_size"   : [1]
  "iterations"        : [1]
  "covariance_y"      : [0.00001]
  "tweedie_covariance": [True]

# ===== Partitions =====
#
Cluster:

  "account"  : ["bsmfc"]

  sampling_prior:
    "cpus"     : [8]
    "gpus"     : [1]
    "partition": ["gpu"]
    "ram"      : ["60GB"]
    "time"     : ["01:00:00"]

  sampling_posterior:
    "cpus"     : [8]
    "gpus"     : [1]
    "partition": ["gpu"]
    "ram"      : ["60GB"]
    "time"     : ["02:00:00"]

  sampling_reconstruction:
    "cpus"     : [8]
    "gpus"     : [1]
    "partition": ["debug-gpu"]
    "ram"      : ["60GB"]
    "time"     : ["00:30:00"]

  computing_metrics:
    "cpus"     : [1]
    "partition": ["batch"]
    "ram"      : ["60GB"]
    "time"     : ["02:00:00"]

  visualizations:
    "cpus"     : [1]
    "partition": ["batch"]
    "ram"      : ["60GB"]
    "time"     : ["01:00:00"]


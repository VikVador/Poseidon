# ====================================
#           P O S E I D O N
# ====================================
#
# ===== Cluster =====
#
Cluster:
  "account"  : ["bsmfc"]
  "cpus"     : [64]
  "gpus"     : [8]
  "partition": ["ia"]
  "ram"      : ["480GB"]
  "time"     : ["48:00:00"]


# ===== Training =====
#
Training:

  config_wandb:
    "project": ["Poseidon-Black-Sea-Shelf-Training"]
    "mode":    ["online"]

  config_problem:
    "model_checkpoint_name":    ["magic-dew-12", "swift-morning-11"]
    "model_checkpoint_version": ["last"]
    "model_saving":             [True]

  config_scheduler:
    "scheduler": ["constant"]

  config_optimizer:
    "betas":         [[0.9, 0.999, 0.999]]
    "learning_rate": [0.0002]
    "optimizer":     ["soap"]
    "weight_decay":  [0.001]

  config_dataloader:
    "batch_size":      [128]
    "num_workers":     [16]
    "prefetch_factor": [1]
    "shuffle":         [[True, False, False]]

  config_training:
    "steps_training":              [6400]
    "steps_gradient_accumulation": [2]
    "steps_logging":               [16]
    "steps_validation":            [256]
    "sigma_min":                   [0.00001]
    "sigma_max":                   [1000]
    "blanket_size":                [1]

  config_nn:
    "kernel_size":      [[1, 3, 3]]
    "mod_features":     [512]
    "ffn_factor":       [2]
    "hid_blocks":       [[8, 8, 8]]
    "hid_channels":     [[256, 512, 1024]]
    "attention_heads" : [{"2": 1}]

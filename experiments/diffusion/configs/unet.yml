# ====================================
#           P O S E I D O N
# ====================================
#
# ===== Cluster =====
#
Cluster:
  "account"        : ["bsmfc"]
  "nodes"          : [8]           
  "cpus-per-node"  : [32]           
  "gpus-per-node"  : [4]            
  "ram-per-node"   : ["240GB"]      
  "partition"      : ["gpu"]
  "time"           : ["48:00:00"]


# ===== Training Configuration =====
#

Training:

  config_wandb:
    "project": ["Poseidon-Training"]
    "mode":    ["online"]

  config_problem:
    "model_checkpoint_name":    [null]
    "model_checkpoint_version": [null]
    "model_saving":             [True]

  config_scheduler:
    "scheduler": ["constant"]

  config_optimizer:
    "betas":         [[0.9, 0.999, 0.999]]
    "learning_rate": [0.0002]
    "optimizer":     ["soap"]
    "weight_decay":  [0.0]

  config_dataloader:
    "batch_size_per_gpu": [4]                     
    "num_workers":        [4]                     
    "prefetch_factor":    [1]                     
    "shuffle":            [[True, False, False]]  

  config_training:
    "steps_training":              [12800]    
    "steps_gradient_accumulation": [2]        
    "steps_logging":               [8]        
    "steps_validation":            [256]     
    "sigma_min":                   [0.0001]
    "sigma_max":                   [10000]
    "blanket_size":                [1]

  config_nn:
    "kernel_size":      [[1, 3, 3]]
    "mod_features":     [64]
    "ffn_factor":       [1]
    "hid_blocks":       [[2, 2, 3, 3]]
    "hid_channels":     [[512, 1024, 1024, 2048]]
    "attention_heads" : [{"-1": 1}]


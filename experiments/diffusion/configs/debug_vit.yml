# ====================================
#           P O S E I D O N
# ====================================
#
# ===== Cluster =====
#
Cluster:
  "account"  : ["bsmfc"]
  "cpus"     : [8]
  "gpus"     : [1]
  "partition": ["gpu"]
  "ram"      : ["60GB"]
  "time"     : ["01:00:00"]


# ===== Training =====
#
Training:

  config_wandb:
    "project": ["Poseidon-Training-Black-Sea-Shelf-Debugging"]
    "mode":    ["disabled"]

  config_problem:
    "model_checkpoint_name":    [null]
    "model_checkpoint_version": [null]
    "model_saving":             [False]

  config_scheduler:
    "scheduler": ["constant"]

  config_optimizer:
    "betas":         [[0.9, 0.999, 0.999]]
    "learning_rate": [0.001]
    "optimizer":     ["soap"]
    "weight_decay":  [0.0]

  config_dataloader:
    "batch_size":      [1]
    "num_workers":     [0]
    "prefetch_factor": [null]
    "shuffle":         [[True, False, False]]

  config_training:
    "steps_training":              [32]
    "steps_gradient_accumulation": [1]
    "steps_logging":               [1]
    "steps_validation":            [4]
    "sigma_min":                   [0.00001]
    "sigma_max":                   [1000]
    "blanket_size":                [1]

  config_nn:
    "mod_features":    [16]
    "hid_channels":    [64]
    "hid_blocks":      [1]
    "ffn_factor":      [1]
    "attention_heads": [1]
    "qk_norm":         [true]
    "rope":            [true]
    "patch_size":      [[1, 4, 4]]
    "window_size":     [null]
    "dropout":         [0.05]
